name: Request Project State Update

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggering for testing

permissions:
  contents: read
  issues: write

jobs:
  request-project-state-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Need full history to analyze changes
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        cd .github/scripts
        npm install
        
    - name: Analyze changes and create copilot request
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd .github/scripts
        node create-copilot-request.js