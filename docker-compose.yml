services:
  db:
    build:
      context: ./db
      dockerfile: pgdb.dockerfile
    pull_policy: build
    environment:
      POSTGRES_USER: dockeruser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - eventglimpse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockeruser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    pull_policy: build
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dockeruser:${DB_PASSWORD}@db:5432/mydb
      NODE_ENV: ${NODE_ENV:-prod}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    restart: unless-stopped
    networks:
      - proxy-net
      - default

networks:
  proxy-net:
    external: true
    name: proxy-net

volumes:
  eventglimpse_db_data:
    driver: local