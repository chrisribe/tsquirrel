services:
  db:
    build:
      context: ./db
      dockerfile: pgdb.dockerfile
    environment:
      POSTGRES_USER: dockeruser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockeruser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dockeruser:${DB_PASSWORD}@db:5432/mydb
    restart: unless-stopped
