services:
  db:
    build:
      context: ./db
      dockerfile: pgdb.dockerfile
    pull_policy: build
    environment:
      POSTGRES_USER: dockeruser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: appdb
    volumes:
      - tsquirrel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockeruser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: dockerfile
    pull_policy: build
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    environment:
      DATABASE_URL: postgres://dockeruser:${DB_PASSWORD:-changeme}@db:5432/appdb
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-https://tsquirrel.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-4o-mini}
      INGEST_INTERVAL_MS: ${INGEST_INTERVAL_MS:-21600000}
    networks:
      - proxy-net
      - default

volumes:
  tsquirrel_db:
    driver: local

networks:
  proxy-net:
    external: true
  default:
